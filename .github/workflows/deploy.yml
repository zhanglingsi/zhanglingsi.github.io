# Ref: https://docs.astro.build/en/guides/deploy/github/

name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ astro ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro branch
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro build)
        run: pnpm run build

      # GitHub Pages 默认会用 Jekyll 渲染，而 Jekyll 会忽略所有以下划线 "_" 开头的文件/目录。
      # Astro 把所有 CSS/JS 产到 _astro/ 下，没有 .nojekyll 就会全部 404，页面变裸 HTML。
      # 在 dist 根放一个空的 .nojekyll 即可让 GitHub Pages 跳过 Jekyll。
      - name: Add .nojekyll to dist (avoid Jekyll ignoring _astro/)
        run: touch ./dist/.nojekyll

      - name: Deploy to master branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./dist
          git init
          git config user.name "zhanglingsi"
          git config user.email "zhanglingsi@aliyun.com"
          git add .
          git commit -m "Update docs by GitHub Actions ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/zhanglingsi/zhanglingsi.github.io.git" HEAD:master
  
