# Astro 官方推荐的 GitHub Pages 部署方式（基于 artifact，不经过 Jekyll）
# 参考：https://docs.astro.build/en/guides/deploy/github/
#
# 与 dev 分支的等价功能：push 到 astro 分支 -> 自动构建 -> 自动发布到 GitHub Pages
# 区别：不再强推 master 分支，而是由 Pages 直接服务构建产物（artifact），
#       彻底规避 Jekyll 忽略 _astro/ 导致 CSS/JS 全部 404 的问题。

name: Deploy to GitHub Pages

on:
  push:
    branches: [ astro ]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过正在运行和最新排队之间的运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro build)
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
