name: Deploy Astro Blog

# 推送到 astro 分支时自动触发构建部署（也支持手动触发）
on:
  push:
    branches:
      - astro
  workflow_dispatch:

# 允许使用内置 GITHUB_TOKEN 向仓库写入（推送 master 分支）
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro branch
        uses: actions/checkout@v4

      # Astro 5 需要 Node 18.20+，这里使用 Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro build)
        run: pnpm run build

      # 与 dev 分支 deploy.yml 逻辑一致：
      # 将编译产物 dist/ 强制推送到 master 分支，实现博客发布
      - name: Deploy to master branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./dist
          git init
          git config user.name "zhanglingsi"
          git config user.email "zhanglingsi@aliyun.com"
          git add .
          git commit -m "Update docs by GitHub Actions ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/zhanglingsi/zhanglingsi.github.io.git" HEAD:master
